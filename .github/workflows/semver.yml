name: Automated SemVer Pipeline

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for git tag push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for setuptools-scm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools-scm fastapi uvicorn

      - name: Bump version and tag release
        env:
          GIT_AUTHOR_NAME: production-readiness bot
          GIT_AUTHOR_EMAIL: bot@example.com
          GIT_COMMITTER_NAME: production-readiness bot
          GIT_COMMITTER_EMAIL: bot@example.com
        run: |
          # Determine the next version using setuptools-scm
          VERSION=$(python -c "from setuptools_scm import get_version; print(get_version(root='.', relative_to='.'))")
          echo "Current version: $VERSION"

          # Parse major.minor.patch and bump patch
          IFS='.' read -ra PARTS <<<"$VERSION"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=$((PARTS[2] + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "New version: $NEW_VERSION"

          # Create an annotated tag
          git tag -a "v${NEW_VERSION}" -m "Release $NEW_VERSION"

          # Push the tag
          git push origin "v${NEW_VERSION}"